name: Build AMPR with diagnostic trace in download

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'Makefile'
      - 'ps5/**'
      - 'tools/**'
      - '!tools/sync_upstream_release.py'
      - '!tools/patch_download_log.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ampr-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify diagnostic trace path
        run: python3 tools/patch_download_log.py --check
      - name: Match Rust version to the PS5 build
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          recipe = Path("ps5/Dockerfile").read_text()
          match = re.search(r"^ENV RUSTUP_TOOLCHAIN=(\S+)", recipe, re.MULTILINE)
          if not match:
              raise SystemExit("Rust toolchain missing from ps5/Dockerfile")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RUSTUP_TOOLCHAIN={match.group(1)}\n")
          PY
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - run: cargo test --workspace --locked

  sprx:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify diagnostic trace path
        run: python3 tools/patch_download_log.py --check
      - uses: actions/cache@v4
        with:
          path: |
            out/cargo-home/registry
            out/cargo-home/git
          key: sprx-cargo-${{ hashFiles('Cargo.lock', 'ps5/Dockerfile') }}
          restore-keys: sprx-cargo-
      - name: Build and verify release and diagnostic SPRX
        run: ./ps5/build-docker.sh dist
      - name: Checksum
        run: sha256sum libSceAmpr.sprx libSceAmpr-debug.sprx > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sprx
          path: |
            libSceAmpr.sprx
            libSceAmpr-debug.sprx
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [test, sprx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: sprx
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/ampr-sys/Cargo.toml", "rb"))["package"]["version"])')
          tag="download-v${version}-${SOURCE_SHA:0:7}"
          printf 'AMPR %s with diagnostic trace in `/download/ampr_emu_trace.txt`.\n\nUse `libSceAmpr-debug.sprx` for diagnostics (install as `libSceAmpr.sprx`). Source: %s\n' "$version" "$SOURCE_SHA" > release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber libSceAmpr.sprx libSceAmpr-debug.sprx SHA256SUMS
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "AMPR $version (/download)" --notes-file release-notes.md \
              libSceAmpr.sprx libSceAmpr-debug.sprx SHA256SUMS
          fi
